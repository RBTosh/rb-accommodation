<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F8F8F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16141E" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RB Stays">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Rainbow Bridge Hawaii</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;600&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: quiet top bar (desktop tabs) / bottom tab bar on phones; photo-led card grid; side sheet for one space; modal forms; calendar scrolls in its own frame. */
:root{
  /* Rainbow Bridge brand: indigo #44405B, gold #BE974C, rose #85524E, cream #F8F8F2 */
  --bg:#F8F8F2; --surface:#FFFFFF; --sunk:#EFEEE8; --tint:#E8E6EE;
  --ink:#3A3650; --ink-2:#605C73; --ink-3:#94909F; --line:#E6E4DC; --line-2:#D3D0C8;
  --brand:#44405B; --brand-ink:#F8F8F2; --gold:#B48D45; --gold-soft:#F4ECDD;
  --accent:#85524E; --accent-soft:#F3E6E3;
  --ok:#3B7A56; --ok-soft:#E3EFE7; --occ:#55508A; --occ-soft:#E8E6F2; --full:#6A4C8C; --full-soft:#EEE6F3;
  --idle:#80786C; --idle-soft:#EFECE6; --warn:#8F6616; --warn-soft:#F5ECD6; --crit:#AE3A2D; --crit-soft:#F7E2DE;
  --c-resident:#4A6593; --c-helper:#357D6F; --c-volunteer:#977030; --c-guest:#A65076; --c-workshop:#6A59B2; --c-short:#B9733A;
  --hatch:rgba(58,54,80,.06); --scrim:rgba(30,27,45,.35);
  --f-display:"Alegreya", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --f-body:"Figtree", "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r:14px; --r-sm:8px;
  --shadow-sm:0 1px 2px rgba(20,24,22,.05), 0 2px 8px rgba(20,24,22,.04);
  --shadow:0 2px 6px rgba(20,24,22,.06), 0 18px 40px rgba(20,24,22,.10);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#16141E; --surface:#1F1C2A; --sunk:#282535; --tint:#2E2A3D;
  --ink:#ECEAF2; --ink-2:#B5B1C4; --ink-3:#86829A; --line:#2F2C3C; --line-2:#413D52;
  --brand:#2B2740; --brand-ink:#F1EEE4; --gold:#D4B06A; --gold-soft:#3A3122;
  --accent:#D99A92; --accent-soft:#3B2A2B;
  --ok:#78C496; --ok-soft:#1C3125; --occ:#A9A3DC; --occ-soft:#2A2740; --full:#C3A6E0; --full-soft:#33283F;
  --idle:#B0A899; --idle-soft:#2A2722; --warn:#E0B259; --warn-soft:#352B16; --crit:#EF8C7C; --crit-soft:#3A201C;
  --c-resident:#5E7DB0; --c-helper:#3B9585; --c-volunteer:#A98132; --c-guest:#BC5E89; --c-workshop:#7C6BCB; --c-short:#D08E55;
  --hatch:rgba(236,234,242,.05); --scrim:rgba(0,0,0,.55);
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  --shadow:0 2px 6px rgba(0,0,0,.3), 0 18px 40px rgba(0,0,0,.4);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#16141E; --surface:#1F1C2A; --sunk:#282535; --tint:#2E2A3D;
  --ink:#ECEAF2; --ink-2:#B5B1C4; --ink-3:#86829A; --line:#2F2C3C; --line-2:#413D52;
  --brand:#2B2740; --brand-ink:#F1EEE4; --gold:#D4B06A; --gold-soft:#3A3122;
  --accent:#D99A92; --accent-soft:#3B2A2B;
  --ok:#78C496; --ok-soft:#1C3125; --occ:#A9A3DC; --occ-soft:#2A2740; --full:#C3A6E0; --full-soft:#33283F;
  --idle:#B0A899; --idle-soft:#2A2722; --warn:#E0B259; --warn-soft:#352B16; --crit:#EF8C7C; --crit-soft:#3A201C;
  --c-resident:#5E7DB0; --c-helper:#3B9585; --c-volunteer:#A98132; --c-guest:#BC5E89; --c-workshop:#7C6BCB; --c-short:#D08E55;
  --hatch:rgba(236,234,242,.05); --scrim:rgba(0,0,0,.55);
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  --shadow:0 2px 6px rgba(0,0,0,.3), 0 18px 40px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
h1,h2,h3{font-family:var(--f-display);font-weight:500;margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)}
.label{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
.small{font-size:14px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:24px;padding-block:14px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));max-width:1320px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;min-width:0;text-decoration:none;color:var(--ink)}
.brand .logo{width:42px;height:42px;object-fit:contain;display:block;flex:none}
.brand .logo-fallback{width:42px;height:42px;border-radius:21px 21px 6px 6px;background:var(--brand);color:var(--gold);display:grid;place-items:center;font-family:var(--f-display);font-size:15px;letter-spacing:.06em}
.brand-sub{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);font-weight:500;white-space:nowrap}
.tabs{display:flex;gap:4px;flex:1;justify-content:center}
.tab{border:0;background:none;padding:8px 14px;border-radius:999px;color:var(--ink-2);font-weight:500;font-size:15px;white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:2px}
.tab:hover{color:var(--ink);background:var(--sunk)}
.tab[aria-selected="true"]{color:var(--brand-ink);background:var(--brand)}
.tab .short,.tab svg{display:none}
.top-actions{display:flex;gap:8px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);padding:8px 14px;border-radius:999px;font-weight:500;font-size:15px;line-height:1.2}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary:hover{opacity:.88}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--sunk);color:var(--ink)}
.btn.danger{color:var(--crit);border-color:transparent;background:transparent}
.btn.danger.armed{background:var(--crit);color:#fff}
.btn.sm{padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
.plus::before{content:"+";font-size:1.15em;line-height:1;margin-top:-1px}

main{max-width:1320px;margin:0 auto;padding-block:28px 72px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.view{display:flex;flex-direction:column;gap:22px}
.view-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.view-h h2{font-size:34px;line-height:1.1}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-radius:var(--r-sm);background:var(--warn-soft);font-size:15px}
.banner.info{background:var(--sunk);color:var(--ink-2)}
.banner .grow{flex:1;min-width:200px}

/* summary */
.summary{display:flex;flex-wrap:wrap;gap:6px 28px;color:var(--ink-2);font-size:15px}
.summary b{color:var(--ink);font-weight:600;font-size:17px;margin-right:5px}
.summary .alert b,.summary .alert{color:var(--crit)}

.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.toolbar .spacer{flex:1}
.seg{display:inline-flex;gap:4px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:transparent;padding:6px 13px;border-radius:999px;color:var(--ink-2);font-size:14px;font-weight:500}
.seg button:hover{border-color:var(--line-2);color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
input.inline{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:22px}
.card{display:flex;flex-direction:column;background:var(--surface);border:0;border-radius:var(--r);overflow:hidden;text-align:left;padding:0;box-shadow:var(--shadow-sm);transition:box-shadow .2s, transform .2s}
button.card:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.ph{position:relative;aspect-ratio:4/3;max-width:100%;background:var(--tint);overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph.empty{display:grid;place-items:center}
.ph.empty b{font-family:var(--f-display);font-weight:400;font-size:72px;line-height:1;color:var(--line-2)}
.ph .count{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.5);color:#fff;font-size:12px;padding:2px 8px;border-radius:999px}
.ph .pill{position:absolute;left:10px;top:10px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.card-body{display:flex;flex-direction:column;gap:6px;padding:14px 16px 16px;flex:1}
.card h3{font-size:22px;line-height:1.15}
.cap{font-size:14.5px;color:var(--ink-2)}
.dist{font-size:13.5px;color:var(--ink-3)}
.who{font-size:14.5px;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:13px;padding:3px 10px;border-radius:999px;background:var(--sunk);color:var(--ink-2);white-space:nowrap;font-weight:500}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.crit{background:var(--crit-soft);color:var(--crit)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap;flex:none;background:var(--surface)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st-open{color:var(--ok)} .st-part{color:var(--occ)} .st-full{color:var(--full)} .st-notready{color:var(--idle)} .st-over{color:var(--crit)}
.pill.soft.st-open{background:var(--ok-soft)}.pill.soft.st-part{background:var(--occ-soft)}.pill.soft.st-full{background:var(--full-soft)}.pill.soft.st-notready{background:var(--idle-soft)}.pill.soft.st-over{background:var(--crit-soft)}
.card-foot{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:6px}
.swatch{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.cat-resident{background:var(--c-resident)}.cat-helper{background:var(--c-helper)}.cat-volunteer{background:var(--c-volunteer)}.cat-guest{background:var(--c-guest)}.cat-workshop{background:var(--c-workshop)}

.empty-state{display:flex;flex-direction:column;align-items:flex-start;gap:14px;padding:44px 36px;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow-sm);max-width:640px}
.empty-state h2{font-size:30px;line-height:1.15}
.empty-state p{margin:0;color:var(--ink-2);max-width:58ch}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* side sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;animation:fade .2s ease}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(540px,100%);background:var(--bg);z-index:41;overflow-y:auto;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px);animation:slide .25s cubic-bezier(.2,.8,.2,1)}
@keyframes fade{from{opacity:0}} @keyframes slide{from{transform:translateX(24px);opacity:.6}}
.dr-top{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;padding:10px 14px;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.dr-top .grow{flex:1}
.gallery{position:relative;background:var(--tint);aspect-ratio:3/2;max-width:100%}
.gallery img{width:100%;height:100%;object-fit:cover;display:block}
.gallery .nav{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.85);color:#1D2320;font-size:20px;line-height:1;display:grid;place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.gallery .prev{left:12px}.gallery .next{right:12px}
.gallery .idx{position:absolute;left:12px;bottom:12px;background:rgba(0,0,0,.5);color:#fff;font-size:12px;padding:2px 9px;border-radius:999px}
.thumbs{display:flex;gap:6px;padding:10px 18px 0;overflow-x:auto}
.thumbs button{flex:none;width:60px;height:46px;padding:0;border:2px solid transparent;border-radius:6px;overflow:hidden;background:var(--tint);opacity:.75}
.thumbs button[aria-current="true"]{border-color:var(--ink);opacity:1}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.dr-body{display:flex;flex-direction:column;gap:26px;padding:18px 20px 48px}
.dr-title{display:flex;flex-direction:column;gap:10px}
.dr-title h2{font-size:34px;line-height:1.08}
.sect{display:flex;flex-direction:column;gap:10px}
.sect-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sect-h h3{font-size:21px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border-radius:var(--r-sm);overflow:hidden}
.facts div{background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.facts small{font-size:12.5px;color:var(--ink-3)}
.facts b{font-weight:600;font-size:16px}
.prose{margin:0;white-space:pre-wrap;font-size:15.5px;color:var(--ink)}
.list{display:flex;flex-direction:column;background:var(--surface);border-radius:var(--r-sm);box-shadow:var(--shadow-sm);overflow:hidden}
.li{display:flex;gap:12px;align-items:center;padding:11px 14px;border-top:1px solid var(--line);text-align:left;background:transparent;border-left:0;border-right:0;border-bottom:0;width:100%}
.li:first-child{border-top:0}
button.li:hover{background:var(--sunk)}
button.li:disabled{cursor:default}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:500}
.li .s{font-size:13.5px;color:var(--ink-2)}
.none{padding:14px;color:var(--ink-3);font-size:14.5px}
.warnbox{padding:10px 14px;border-radius:var(--r-sm);background:var(--crit-soft);color:var(--crit);font-size:14.5px}

/* repairs */
.prio{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;flex:none}
.p-blocker{background:var(--crit-soft);color:var(--crit)}
.p-needed{background:var(--warn-soft);color:var(--warn)}
.p-nice{background:var(--sunk);color:var(--ink-2)}
.wstat{border:1px solid var(--line-2);background:transparent;border-radius:999px;padding:3px 11px;font-size:13px;font-weight:500;flex:none;min-width:92px}
.wstat.doing{border-color:var(--occ);color:var(--occ)}
.wstat.done{border-color:var(--ok);color:var(--ok)}
.li.done .t{text-decoration:line-through;color:var(--ink-3)}
.wgroup{display:flex;flex-direction:column;gap:10px}
.wgroup-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.wgroup-h h3{font-size:22px}
.wgroup-h button{border:0;background:none;padding:0;text-align:left}
.wgroup-h button:hover h3{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px}
.ready-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.ready-item{display:flex;flex-direction:column;gap:6px;padding:14px 16px;background:var(--surface);border:0;border-radius:var(--r-sm);box-shadow:var(--shadow-sm);text-align:left}
.ready-item:hover{box-shadow:var(--shadow)}
.ready-item b{font-family:var(--f-display);font-weight:500;font-size:20px}
.meter{height:5px;border-radius:3px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok)}

/* calendar */
.cal-frame{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow-sm);overflow-x:auto;overflow-y:hidden;position:relative}
.cal{position:relative;min-width:max-content}
.cal-row{display:flex;border-top:1px solid var(--line);min-height:46px}
.cal-row:first-child{border-top:0}
.cal-name{position:sticky;left:0;z-index:3;width:168px;flex:none;background:var(--surface);border-right:1px solid var(--line);padding:6px 14px;display:flex;flex-direction:column;justify-content:center;text-align:left;border-top:0;border-bottom:0;border-left:0}
button.cal-name:hover{background:var(--sunk)}
.cal-name b{font-weight:500;font-size:14.5px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-name small{font-size:12px;color:var(--ink-3)}
.cal-track{position:relative;flex:none;cursor:copy}
.cal-track.ro{cursor:default}
.cal-track.notready{background-image:repeating-linear-gradient(135deg,transparent 0 7px,var(--hatch) 7px 8px)}
.cal-days{position:relative;height:50px}
.cal-days .d{position:absolute;top:20px;bottom:2px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--ink-3);line-height:1.15}
.cal-days .d.we{color:var(--ink-2)}
.cal-days .d.today span:last-child{background:var(--brand);color:var(--brand-ink);border-radius:999px;min-width:20px;padding:0 4px;text-align:center;font-weight:600}
.cal-days .m{position:absolute;top:4px;font-size:12px;font-weight:600;color:var(--ink-2);padding-left:6px;white-space:nowrap}
.gridlines{position:absolute;inset:0;pointer-events:none}
.gridlines i{position:absolute;top:0;bottom:0;border-left:1px solid var(--line);opacity:.5}
.gridlines i.wk{opacity:1}
.weekend{position:absolute;top:0;bottom:0;background:var(--hatch);pointer-events:none}
.todayline{position:absolute;top:0;bottom:0;width:2px;background:var(--gold);opacity:.9;pointer-events:none;z-index:2}
.over{position:absolute;top:0;bottom:0;background:var(--crit-soft);border-top:2px solid var(--crit);pointer-events:none}
.bar{position:absolute;height:26px;border-radius:999px;color:#fff;font-size:12.5px;font-weight:500;padding:0 10px;display:flex;align-items:center;gap:4px;overflow:hidden;white-space:nowrap;border:0;text-align:left;z-index:1}
.bar:hover{filter:brightness(1.08)}
.bar.hold{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.25) 0 5px,transparent 5px 10px)}
.bar.open-end{border-top-right-radius:0;border-bottom-right-radius:0;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent)}
.bar .hc{font-size:11px;opacity:.85}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13.5px;color:var(--ink-2);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:7px}
.lg-hold{width:18px;height:10px;border-radius:999px;background:var(--ink-3);background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.4) 0 3px,transparent 3px 6px)}
.lg-over{width:18px;height:10px;background:var(--crit-soft);border-top:2px solid var(--crit)}
.lg-nr{width:18px;height:10px;border-radius:2px;background-image:repeating-linear-gradient(135deg,transparent 0 3px,var(--ink-3) 3px 4px);opacity:.5}

/* calendar availability */
.tint{position:absolute;top:0;bottom:0;pointer-events:none}
.tint.free{background:color-mix(in srgb,var(--ok) 15%,transparent)}
.tint.free.proj{background:repeating-linear-gradient(90deg,color-mix(in srgb,var(--ok) 15%,transparent) 0 5px,transparent 5px 8px)}
.tint.room{background:color-mix(in srgb,var(--ok) 6%,transparent)}
.tint.nr{background-image:repeating-linear-gradient(135deg,transparent 0 6px,var(--line-2) 6px 7px);opacity:.7}
.tint.over{background:var(--crit-soft);border-top:2px solid var(--crit)}
.band{position:absolute;top:0;bottom:0;border-left:1.5px dashed var(--accent);border-right:1.5px dashed var(--accent);background:color-mix(in srgb,var(--accent) 6%,transparent);pointer-events:none;z-index:2}
.cal-row.dim{opacity:.35}
.cal-row.fit .cal-name{box-shadow:inset 3px 0 0 var(--ok)}
.cal-row.part .cal-name{box-shadow:inset 3px 0 0 var(--warn)}
.cal-row.drop .cal-track{box-shadow:inset 0 0 0 2px var(--occ)}
.cal-row.drop .cal-name{background:var(--occ-soft)}
.bar.blk{background:var(--ink-3);background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.2) 0 5px,transparent 5px 10px)}
.bar[data-kind="stay"]:not(:disabled){cursor:grab}
.bar .grip{position:absolute;right:0;top:0;bottom:0;width:10px;cursor:ew-resize}
.bar .grip::after{content:"";position:absolute;right:4px;top:8px;bottom:8px;width:2px;border-radius:1px;background:rgba(255,255,255,.6)}
.bar.dragging{z-index:6;box-shadow:0 8px 20px rgba(0,0,0,.25);opacity:.92}
body.is-dragging,body.is-dragging *{cursor:grabbing!important;user-select:none;-webkit-user-select:none}
.drag-tip{position:fixed;z-index:70;pointer-events:none;background:var(--ink);color:var(--bg);font-size:13px;padding:4px 11px;border-radius:999px;white-space:nowrap;box-shadow:var(--shadow)}
.cal-beds{position:relative;height:30px}
.cal-beds span{position:absolute;top:0;bottom:0;display:grid;place-items:center;font-size:11.5px;font-weight:600;color:var(--ok)}
.cal-beds span.b0{color:var(--ink-3);font-weight:400}
.cal-beds.narrow span{font-size:9.5px}
.cal-row.beds{min-height:30px;background:var(--sunk)}
.cal-row.beds .cal-name{background:var(--sunk)}
.finder{display:flex;flex-direction:column;gap:12px;padding:16px 18px;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow-sm)}
.finder .row{gap:10px 14px}
.finder label{display:flex;align-items:center;gap:7px;font-size:14px;color:var(--ink-2)}
.finder h3{font-size:19px;margin-right:4px}
.fits{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:14.5px}
.fitchip{border:1px solid var(--ok);color:var(--ok);background:var(--ok-soft);border-radius:999px;padding:4px 12px;font-size:14px;font-weight:500}
.fitchip.part{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.fitchip:hover{filter:brightness(.96)}
.lg-free{width:18px;height:10px;border-radius:2px;background:color-mix(in srgb,var(--ok) 15%,transparent);box-shadow:inset 0 0 0 1px var(--ok)}
.lg-room{width:18px;height:10px;border-radius:2px;background:color-mix(in srgb,var(--ok) 6%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ok) 45%,transparent)}
.lg-blk{width:18px;height:10px;border-radius:999px;background:var(--ink-3)}
.toast{display:flex;align-items:center;gap:14px}
.key{flex:1;min-width:0}
.key summary{cursor:pointer;font-size:14px;color:var(--ink-2);font-weight:500;width:max-content;list-style:none}
.key summary::-webkit-details-marker{display:none}
.key summary::after{content:" ▾";font-size:11px}
.key[open] summary{display:none}
@media (max-width:720px){
  .key[open] summary{display:block;margin-bottom:8px}
  .finder .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .finder h3{grid-column:1 / -1}
  .finder label{flex-direction:column;align-items:stretch;gap:4px}
  .finder label input{width:100%!important}
}
.toast button{background:none;border:0;padding:0;color:var(--bg);font-weight:600;text-decoration:underline;text-underline-offset:3px}

/* calendar v3: names only */
.cal-frame{--namew:168px}
.cal-days.slim{height:30px}
.gridlines i{border-left:1px solid var(--line-2);opacity:1}
.cal-track{background-color:transparent}
.bar{background:color-mix(in srgb,var(--occ) 16%,var(--surface));color:var(--ink);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--occ) 35%,transparent);border-radius:7px;overflow:hidden;overflow:clip;padding:0}
.bar:hover{filter:none;background:color-mix(in srgb,var(--occ) 26%,var(--surface))}
.bar .n{position:sticky;left:calc(var(--namew) + 6px);padding:0 9px;white-space:nowrap;font-weight:500}
.bar .n small{font-size:11.5px;color:var(--ink-2);font-weight:400}
.bar.hold{background:var(--surface);background-image:none;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--occ) 45%,transparent);outline:0}
.bar.hold .n{color:var(--ink-2)}
.bar.open-end{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 40px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 40px),transparent)}
.bar.blk{background:color-mix(in srgb,var(--warn) 16%,var(--surface));background-image:none;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--warn) 40%,transparent);color:var(--ink)}
.bar.nrb{background:var(--sunk);box-shadow:none;color:var(--ink-3);font-size:12px;display:flex;align-items:center;cursor:default;background-image:repeating-linear-gradient(135deg,transparent 0 6px,var(--hatch) 6px 7px)}
.bar .grip::after{background:color-mix(in srgb,var(--occ) 55%,transparent)}
.cal-days .m{border-left:1px solid var(--line-2);padding-left:6px}
.bar.spill{overflow:visible}
.bar.spill .n{position:absolute;left:100%;top:50%;transform:translateY(-50%);padding:0 0 0 6px;color:var(--ink)}

/* permanent residences */
.res-group{display:flex;flex-direction:column;gap:14px;margin-top:34px;padding-top:22px;border-top:1px solid var(--line)}
.card.res{background:var(--sunk);box-shadow:none}
.card.res .ph{filter:saturate(.6);opacity:.85}
.card.res h3{color:var(--ink-2)}
.cal-row.res .cal-track{background-color:var(--sunk)}
.cal-row.res .cal-name{background:var(--sunk)}
.cal-row.res .cal-name b{color:var(--ink-2)}
.cal-row.res .bar{background:color-mix(in srgb,var(--ink-3) 16%,var(--surface));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ink-3) 35%,transparent)}
.cal-divider{min-height:10px;background:var(--sunk)}
.cal-divider .cal-name{background:var(--sunk);justify-content:flex-end;padding-bottom:4px}

/* holding row + events */
.cal-row.holdrow .cal-track{background-color:color-mix(in srgb,var(--accent) 5%,transparent)}
.cal-row.holdrow .cal-name{background:color-mix(in srgb,var(--accent) 7%,var(--surface))}
.cal-row.holdrow .cal-name b{color:var(--accent)}
.cal-row.holdrow .bar{background:var(--surface);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--accent) 55%,transparent)}
.cal-row.evrow{min-height:32px}
.cal-evs{position:relative;height:32px}
.evbar{position:absolute;top:5px;height:22px;border:0;border-radius:6px;background:var(--gold-soft);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--gold) 45%,transparent);color:var(--ink);font-size:12.5px;font-weight:600;padding:0;overflow:hidden;overflow:clip;text-align:left}
.evbar .n{position:sticky;left:calc(var(--namew) + 6px);padding:0 8px;white-space:nowrap}
.evbar small{font-weight:400;color:var(--ink-2)}
.evbar.spill{overflow:visible}
.evbar.spill .n{position:absolute;left:0;top:50%;transform:translateY(-50%);padding-left:6px}
.evtint{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--gold) 9%,transparent);pointer-events:none}
.linkish{border:0;background:none;padding:0;font-weight:600;color:var(--ink);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}

/* hosted: login + visitor mode */
.login{position:fixed;inset:0;z-index:80;background:var(--bg);display:grid;place-items:center;padding:20px}
.login-card{width:min(380px,100%);display:flex;flex-direction:column;gap:16px;padding:32px 28px;background:var(--surface);border-radius:18px;box-shadow:var(--shadow)}
.login-card h2{font-size:30px}
.login-logo{width:84px;height:84px;object-fit:contain;align-self:flex-start;margin-bottom:-4px}
.login-card form{display:flex;flex-direction:column;gap:14px}
.login-card a{color:var(--ink)}
.visit-mode .tabs,.visit-mode .top-actions,.visit-mode #notice,.visit-mode #view-visitors > .banner{display:none!important}
.visit-mode main{padding-bottom:60px}
#pubLink b{word-break:break-all}

/* sync state */
.banner.sync{padding:9px 14px;font-size:14px}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--line-2);border-top-color:var(--brand);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}

/* photos in the space form */
.pstrip{display:flex;flex-wrap:wrap;gap:8px}
.pthumb{position:relative;width:96px;height:72px;border-radius:8px;overflow:hidden;background:var(--tint);flex:none}
.pthumb img{width:100%;height:100%;object-fit:cover;display:block}
.pthumb.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--ink-2)}
.pbtn{position:absolute;top:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:14px;line-height:1;display:grid;place-items:center;padding:0}
.pbtn.star{left:4px}.pbtn.star.on{background:var(--gold);color:#1E1B28}.pbtn.x{right:4px;font-size:17px}
.padd{width:96px;height:72px;border:1.5px dashed var(--line-2);border-radius:8px;background:transparent;color:var(--ink-2);font-size:12.5px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;flex:none}
.padd span{font-size:22px;line-height:1}
.padd:hover{border-color:var(--ink-3);color:var(--ink)}

/* calendar bar, this week, last resort, double booking, book button */
.cal-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.cal-bar .nav{gap:6px;flex-wrap:nowrap}
.seg .short{display:none}
.jump{position:relative;padding:6px 10px;overflow:hidden}
.jump input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:0;padding:0}
.weekline{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:14px}
.wl-label{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:500;margin-right:4px}
.wl-item{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;color:var(--ink);font-size:14px;text-align:left}
.wl-item b{font-weight:600;margin-right:4px}
.wl-item.out{color:var(--ink-2)}
.wl-item:hover{border-color:var(--line-2)}
.cal-row.lastrow .cal-track{background-color:color-mix(in srgb,var(--gold) 9%,transparent)}
.cal-row.lastrow .cal-name{background:color-mix(in srgb,var(--gold) 12%,var(--surface))}
.bar.clash{box-shadow:inset 0 0 0 2px var(--accent)!important}
.card.last{background:color-mix(in srgb,var(--gold) 8%,var(--surface))}
.card.nophoto .card-body{padding:16px 18px}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.fitchip.lastchip{border-color:var(--gold);color:var(--ink);background:var(--gold-soft)}
.page-foot{display:flex;justify-content:center;padding-top:20px}
.page-foot .linkish{font-weight:400;color:var(--ink-3);font-size:14px}
.f > span small{font-weight:400;color:var(--ink-3)}
.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:nowrap}
.hbtn{gap:5px;white-space:nowrap}
.hbtn svg{margin:-2px 0 -2px -2px}

/* reorder */
.ro-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;background:var(--sunk);border-radius:var(--r-sm);font-size:14px;color:var(--ink-2);margin-bottom:12px}
.ro-bar .grow{flex:1;min-width:200px}
.ro-list{list-style:none;margin:0 0 16px;padding:0;background:var(--surface);border-radius:var(--r-sm);box-shadow:var(--shadow-sm);overflow:hidden;max-width:640px}
.ro-list[data-g="1"]{background:var(--sunk);box-shadow:none}
.ro-row{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 12px;border-top:1px solid var(--line);user-select:none;-webkit-user-select:none}
.ro-row:first-child{border-top:0}
.ro-row[draggable="true"]{cursor:grab}
.ro-row.dragging{opacity:.35}
.ro-row.drop-before{box-shadow:inset 0 3px 0 var(--brand)}
.ro-row.drop-after{box-shadow:inset 0 -3px 0 var(--brand)}
.ro-handle{color:var(--ink-3);display:grid;place-items:center}
.ro-name{flex:1;font-weight:500;min-width:0}
.ro-list[data-g="1"] .ro-name{color:var(--ink-2)}
.ro-btns{display:flex;gap:4px}
.ro-btns .btn{padding:6px 11px;min-width:40px;font-size:13px}
.ro-btns .btn:disabled{opacity:.25}
#reorderBtn svg{margin-right:2px}

/* visitor view */
.pub-hero{display:flex;flex-direction:column;gap:12px;padding:40px 36px;border-radius:var(--r);background:var(--brand);color:var(--brand-ink)}
.pub-hero .wordmark{width:min(300px,80%);height:auto;margin-bottom:8px}
.pub-hero .label{color:color-mix(in srgb,var(--brand-ink) 65%,transparent)}
.pub-hero h2{font-size:40px;line-height:1.08;max-width:20ch;color:var(--brand-ink)}
.pub-hero p{margin:0;max-width:62ch;color:color-mix(in srgb,var(--brand-ink) 82%,transparent);white-space:pre-wrap;font-size:16.5px}
.pub-hero b{color:var(--gold)!important}
.avail{font-weight:600;font-size:14.5px}
.avail.yes{color:var(--ok)}.avail.part{color:var(--warn)}

/* spaces / repairs switch */
.subnav{display:flex;gap:26px;align-items:flex-end;flex-wrap:wrap}
.subnav button{border:0;background:none;padding:0 0 6px;font-family:var(--f-display);font-weight:500;font-size:34px;line-height:1.1;color:var(--ink-3);border-bottom:2px solid transparent;letter-spacing:-.01em;display:inline-flex;align-items:baseline;gap:8px}
.subnav button:hover{color:var(--ink-2)}
.subnav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold)}
.subnav .cnt{font-family:var(--f-body);font-size:13px;font-weight:600;color:var(--ink-2);background:var(--sunk);border-radius:999px;padding:1px 8px;letter-spacing:0}
.subnav .cnt:empty{display:none}

/* people */
.ty-resident{background:var(--c-resident)}.ty-longterm{background:var(--c-helper)}.ty-shortterm{background:var(--c-short)}.ty-workshop{background:var(--c-workshop)}.ty-guest{background:var(--c-guest)}
.pgroup{display:flex;flex-direction:column;gap:10px}
.pgroup-h{display:flex;align-items:baseline;gap:10px}
.pgroup-h h3{font-size:22px}
.pgroup-h .n{font-size:14px;color:var(--ink-3)}
.pgroup.res .list{background:var(--sunk);box-shadow:none}
.pgroup.res .li .t{color:var(--ink-2)}
.prow .t{font-weight:500}
.prow .when{font-size:13.5px;color:var(--ink-2);white-space:nowrap;flex:none;text-align:right}
.ev-li .t{font-family:var(--f-display);font-size:20px;font-weight:500}
.drawer .summary{margin-top:-8px}
.rf-list{display:flex;flex-direction:column;gap:8px}
.rrow{display:grid;grid-template-columns:minmax(0,1fr) 150px auto;gap:8px;align-items:center}
.rrow input,.rrow select{width:100%;border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:9px 11px;font-size:16px;min-width:0}
.warn-t{color:var(--warn)!important}
@media (max-width:720px){ .rrow{grid-template-columns:minmax(0,1fr) 128px auto} }
.tag-dec{font-size:12.5px;font-weight:600;color:var(--warn);background:var(--warn-soft);padding:2px 9px;border-radius:999px;white-space:nowrap;flex:none}
.prow .when.soon{color:var(--ok);font-weight:600}
.prow .swatch{align-self:flex-start;margin-top:8px}
details.past summary{cursor:pointer;list-style:none;font-family:var(--f-display);font-size:22px;color:var(--ink-2);width:max-content}
details.past summary::-webkit-details-marker{display:none}
details.past summary::after{content:" ▾";font-size:13px;font-family:var(--f-body)}
details.past[open] summary{margin-bottom:10px}
.tychip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--ink-2);padding:3px 10px;border-radius:999px;background:var(--sunk)}
.kv{display:flex;flex-direction:column;background:var(--surface);border-radius:var(--r-sm);box-shadow:var(--shadow-sm);overflow:hidden}
.kv div{display:flex;gap:14px;padding:10px 14px;border-top:1px solid var(--line);font-size:15px}
.kv div:first-child{border-top:0}
.kv small{flex:none;width:76px;color:var(--ink-3);font-size:13px;padding-top:2px}
.kv span{min-width:0;overflow-wrap:anywhere;white-space:pre-wrap}
.kv a{color:var(--ink)}
.li.focus{background:var(--gold-soft)}
details.pastlist summary{cursor:pointer;list-style:none;font-size:14px;color:var(--ink-2);font-weight:500;width:max-content;padding:2px 0}
details.pastlist summary::-webkit-details-marker{display:none}
details.pastlist summary::after{content:" ▾";font-size:11px}
details.pastlist[open] summary{margin-bottom:8px}
details.pastlist .list{background:var(--sunk);box-shadow:none}
.pill.st-deciding{color:var(--warn)}.pill.soft.st-deciding{background:var(--warn-soft)}
.pill.st-coming{color:var(--occ)}.pill.soft.st-coming{background:var(--occ-soft)}
.f .sub{font-size:13px;color:var(--ink-3);margin-top:-2px}
.fieldset{display:flex;flex-direction:column;gap:12px;padding:14px;border-radius:12px;background:var(--sunk)}
.fieldset > span{font-size:14px;font-weight:500;color:var(--ink-2)}
#peopleSearch{width:190px}
@media (max-width:720px){
  .subnav{gap:20px}
  .subnav button{font-size:28px}
  #peopleSearch{flex:1;min-width:0;width:auto}
  .people-bar{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
  .people-bar .spacer{display:none}
  .people-bar #peopleSearch{width:100%;order:-1}
  .people-bar .seg{display:flex;flex-wrap:nowrap;overflow-x:auto;min-width:0;scrollbar-width:none}
  .people-bar .seg::-webkit-scrollbar{display:none}
  .people-bar .seg button{flex:none}
}

/* modal */
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px}
.modal .scrim{position:absolute;z-index:0}
.dialog{position:relative;z-index:1;width:min(560px,100%);max-height:calc(100% - 16px);overflow-y:auto;background:var(--bg);border-radius:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;animation:pop .2s ease}
@keyframes pop{from{transform:translateY(8px);opacity:.5}}
.dialog header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:16px 20px 8px;position:sticky;top:0;background:var(--bg);z-index:1}
.dialog header h2{font-size:26px}
.dialog form{display:flex;flex-direction:column;gap:16px;padding:8px 20px 18px}
.dialog footer{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 20px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--bg)}
.dialog footer .grow{flex:1}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f > span{font-size:14px;font-weight:500;color:var(--ink-2)}
.f small,.hint{font-size:13px;color:var(--ink-3)}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:16px}
.f textarea{min-height:76px;resize:vertical;line-height:1.45}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.unit{position:relative}
.unit input{padding-right:34px}
.unit::after{content:"ft";position:absolute;right:12px;bottom:11px;font-size:14px;color:var(--ink-3);pointer-events:none}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{white-space:nowrap;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);border-radius:999px;padding:5px 12px;font-size:14px;background:var(--surface);cursor:pointer}
.checks input{margin:0;accent-color:var(--ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:15px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

/* phones: bottom tab bar */
@media (max-width:720px){
  .top{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--bg)}
  .top-in{padding-block:12px;gap:12px}
  .brand{flex:1}
  .brand .logo,.brand .logo-fallback{width:34px;height:34px}
  .top{position:relative;top:auto}

<script>
(() => {
"use strict";
/* ---------- constants ---------- */
const CONDITIONS = [["ready","Ready"],["usable","Usable, needs work"],["construction","Under construction"],["planned","Planned"],["offline","Offline"]];
const TYPES = [["resident","Resident"],["longterm","Long-term helper"],["shortterm","Short-term helper"],["workshop","Workshop"],["guest","Guest"]];
const TYPE_SHORT = { resident: "Residents", longterm: "Long-term", shortterm: "Short-term", workshop: "Workshop", guest: "Guests" };
const TYPE_KEYS = new Set(TYPES.map(t => t[0]));
const PSTATUS = [["confirmed","Confirmed"],["coming","Coming, dates unknown"],["deciding","Being decided"]];
const SCRIPT_MSG = "To save people, update the script in your Google Sheet first. It's a one-time step.";
const AMENITIES = [["power","Power"],["water","Water"],["fridge","Fridge"],["bed","Bed & bedding"],["screened","Screened"],["lock","Lockable door"],["wifi","Wifi"]];
const PRIOS = [["blocker","Blocks use"],["needed","Needed"],["nice","Nice to have"]];
const WSTAT = [["todo","To do"],["doing","In progress"],["done","Done"]];
const VIEWS = ["spaces","calendar","repairs","visitors","people","events"];
const label = (list, k) => (list.find(x => x[0] === k) || [k, k || "—"])[1];
const USABLE = new Set(["ready","usable"]);

/* ---------- dates (YYYY-MM-DD) ---------- */
const pad = n => String(n).padStart(2, "0");
const toStr = d => `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`;
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(Date.UTC(y, m-1, d)); };
const now = new Date();
const TODAY = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
const addDays = (s, n) => { const d = parse(s); d.setUTCDate(d.getUTCDate() + n); return toStr(d); };
const diff = (a, b) => Math.round((parse(b) - parse(a)) / 86400000);
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DOW = ["Su","Mo","Tu","We","Th","Fr","Sa"];
const fmt = s => { if (!s) return ""; const d = parse(s); return `${MON[d.getUTCMonth()]} ${d.getUTCDate()}`; };
const fmtY = s => fmt(s) + (s && s.slice(0, 4) !== TODAY.slice(0, 4) ? " " + s.slice(0, 4) : "");
const validDate = s => /^\d{4}-\d{2}-\d{2}$/.test(s || "");

/* ---------- helpers ---------- */
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = s => document.querySelector(s);
const num = (v, d = 0) => { const n = Number(v); return Number.isFinite(n) ? n : d; };
const hrs = h => `${Math.round(num(h) * 10) / 10} h`;
const hasNum = v => v !== "" && v !== null && v !== undefined && Number.isFinite(Number(v));
const ft = v => num(v) === 0 ? "in the space" : `${Math.round(num(v))} ft`;
function lsGet(k){ try { return localStorage.getItem(k); } catch { return null; } }
function lsSet(k, v){ try { localStorage.setItem(k, v); } catch {} }

/* ---------- state ---------- */
const S = {
  db: null, assets: null, canWrite: false, demo: false, connected: false, loaded: new Set(),
  real: { spaces: [], stays: [], work: [], events: [], people: [], attend: [], settings: {} }, demoData: null,
  openPerson: null, openEvent: null, focusStay: null, ptype: "all", pq: "", peopleOk: false,
  view: "spaces", filter: "all", wfilter: "open",
  openSpace: null, pendingOpen: null, gIdx: 0, photoTarget: null,
  cal: { start: addDays(TODAY, -7), zoom: "month" },
  scrollToDate: addDays(TODAY, -2),
  pub: { from: TODAY, to: addDays(TODAY, 7) },
  find: { from: "", to: "", people: 1 },
};
const D = () => S.demo ? S.demoData : S.real;
const space = id => D().spaces.find(s => s.id === id);
const writable = () => S.demo || (S.canWrite && !S.stale);

/* ---------- derived ---------- */
const activeStays = () => D().stays.filter(s => s.status !== "cancelled" && validDate(s.start));
const staysFor = id => activeStays().filter(s => s.spaceId === id);
const covers = (st, day) => st.start <= day && (!st.end || day < st.end);
const heads = st => Math.max(1, num(st.headcount, 1));
const loadOn = (id, day) => staysFor(id).filter(st => covers(st, day)).reduce((a, st) => a + heads(st), 0);
const maxOf = sp => Math.max(num(sp.maxOcc), num(sp.idealOcc), 0);
const kindOf = sp => sp && (sp.kind === "shared" || sp.kind === "lastResort") ? sp.kind : "regular";
const isLast = sp => kindOf(sp) === "lastResort";
const isShared = sp => kindOf(sp) === "shared";
function blocksFor(id){
  return D().work.filter(w => w.spaceId === id && w.status !== "done" && validDate(w.blockStart))
    .map(w => ({ id: w.id, name: w.task, start: w.blockStart, end: validDate(w.blockEnd) && w.blockEnd > w.blockStart ? w.blockEnd : addDays(w.blockStart, 1) }));
}
const notReadyOn = (sp, d) => !USABLE.has(sp.condition) && !(validDate(sp.readyBy) && d >= sp.readyBy);
const blockedOn = (sp, d) => blocksFor(sp.id).some(b => b.start <= d && d < b.end);
// A party is people booked together: a couple or a family share a party id; anyone else is their own party.
const partyKey = st => st.party || st.id;
const partyCount = list => new Set(list.map(partyKey)).size;
const joinNames = names => names.length <= 1 ? (names[0] || "") : names.slice(0, -1).join(", ") + " and " + names[names.length - 1];
const splitNames = s => String(s || "").split(/\s*(?:,|&|\+|\band\b)\s*/i).map(x => x.trim()).filter(Boolean);
function partiesOn(sp, d, excludeId){
  const ex = excludeId ? D().stays.find(x => x.id === excludeId) : null;
  return staysFor(sp.id).filter(x => x.id !== excludeId && !(ex && ex.party && x.party === ex.party) && covers(x, d));
}
// One party per space. A party is one booking (a person, a couple). Shared spaces take several parties up to their number of sites.
// Last-resort spaces (the Dream Temple) can hold several people from different bookings, up to their most-at-once.
const peopleIn = list => list.reduce((a, x) => a + heads(x), 0);
function roomOn(sp, d, people = 1, excludeId){
  if (isRes(sp) || isHold(sp) || notReadyOn(sp, d) || blockedOn(sp, d)) return false;
  const others = partiesOn(sp, d, excludeId);
  if (isShared(sp)) return partyCount(others) < Math.max(1, maxOf(sp));
  if (isLast(sp)) return peopleIn(others) + people <= Math.max(1, maxOf(sp));
  return !others.length && people <= Math.max(1, maxOf(sp));
}
const freeOn = (sp, d, excludeId) => roomOn(sp, d, 1, excludeId) ? 1 : 0;
function fitFor(sp, from, to, people, excludeId){
  const n = diff(from, to); let ok = 0;
  for (let i = 0; i < n; i++) if (roomOn(sp, addDays(from, i), people, excludeId)) ok++;
  return { ok, n };
}
// Nights where a space holds more than it should: two parties in a one-party space, too many tents, or people during a repair closure
function clashDays(sp, from = TODAY, days = 120){
  if (isRes(sp) || isHold(sp)) return [];
  const sts = staysFor(sp.id), bl = blocksFor(sp.id), out = [];
  if (!sts.length) return out;
  for (let i = 0; i < days; i++){
    const d = addDays(from, i), here = sts.filter(st => covers(st, d));
    if (!here.length) continue;
    const blocked = bl.some(b => b.start <= d && d < b.end);
    const tooMany = isShared(sp) ? partyCount(here) > Math.max(1, maxOf(sp)) : isLast(sp) ? peopleIn(here) > Math.max(1, maxOf(sp)) : partyCount(here) > 1;
    if (blocked || tooMany) out.push(d);
  }
  return out;
}
const overbookedDays = clashDays;
function statusOf(sp){
  const here = staysFor(sp.id).filter(x => covers(x, TODAY)), load = here.reduce((a, x) => a + heads(x), 0);
  if (blockedOn(sp, TODAY)) return { key: load ? "over" : "notready", text: load ? "Repairs while occupied" : "Closed for repairs", load };
  if (clashDays(sp, TODAY, 1).length) return { key: "over", text: "Double booked", load };
  if (isShared(sp) && here.length) return { key: "part", text: `${partyCount(here)} of ${Math.max(1, maxOf(sp))} sites`, load };
  if (load > 0) return { key: "full", text: "Occupied", load };
  if (notReadyOn(sp, TODAY)) return { key: "notready", text: validDate(sp.readyBy) ? `Ready ~${fmt(sp.readyBy)}` : label(CONDITIONS, sp.condition), load };
  if (isLast(sp)) return { key: "notready", text: "Last resort", load };
  return { key: "open", text: "Available", load };
}
function capLine(sp){
  if (isRes(sp)) return "";
  if (isShared(sp)) return `${Math.max(1, maxOf(sp))} tent sites`;
  const n = Math.max(1, num(sp.idealOcc)), m = maxOf(sp);
  return `Sleeps ${n}${m > n ? (m === 2 && n === 1 ? " · fits a couple" : `, up to ${m}`) : ""}`;
}
function nextChange(sp){
  const sts = staysFor(sp.id), cur = sts.filter(st => covers(st, TODAY));
  if (cur.length){
    if (cur.some(st => !st.end)) return "";
    const ends = cur.map(st => st.end).sort();
    return `Free from ${fmt(ends[ends.length - 1])}`;
  }
  const up = sts.filter(st => st.start > TODAY).sort((a, b) => a.start < b.start ? -1 : 1)[0];
  return up ? `Booked from ${fmt(up.start)}` : "";
}
const openWork = id => D().work.filter(w => w.spaceId === id && w.status !== "done");
const sumHours = list => list.reduce((a, w) => a + num(w.hours), 0);
const isRes = sp => !!(sp && sp.residence);
const isHold = sp => !!(sp && sp.holding);
const realSpaces = () => D().spaces.filter(sp => !isHold(sp));
const sortedSpaces = (list = D().spaces) => [...list].sort((a, b) => (isHold(b) - isHold(a)) || (isRes(a) - isRes(b)) || (num(a.order, 999) - num(b.order, 999)) || String(a.name || "").localeCompare(String(b.name || ""), undefined, { numeric: true }));
const photoUrl = id => String(id).startsWith("data:") ? id : S.photoBase ? S.photoBase + encodeURIComponent(id) : "/_blob/" + id;

/* ---------- people ----------
   A person is one party: someone, a couple or a family. Stays link to a person by personId,
   or by name for stays booked before People existed. Anyone on the calendar without a
   People record still shows up here, so nothing has to be retyped. */
const norm = s => String(s || "").trim().toLowerCase().replace(/\s+/g, " ");
const byStart = (a, b) => a.start < b.start ? -1 : a.start > b.start ? 1 : 0;
const peopleWritable = () => S.demo || !S.hosted || S.peopleOk;
function guessType(sts){
  const cats = sts.map(x => x.category).filter(Boolean);
  const latest = [...sts].sort(byStart).reverse().find(x => TYPE_KEYS.has(x.category));
  if (latest) return latest.category;
  if (cats.includes("resident")) return "resident";
  if (cats.length && cats.every(c => c === "workshop")) return "workshop";
  if (cats.length && cats.every(c => c === "guest")) return "guest";
  if (cats.includes("volunteer")) return "longterm";
  const nights = sts.reduce((a, x) => a + (x.end ? diff(x.start, x.end) : 200), 0);
  return nights >= 75 ? "longterm" : "shortterm";
}
let PXC = null;
const pxReset = () => { PXC = null; };
function PX(){
  if (PXC) return PXC;
  const real = (D().people || []).filter(p => p && p.id);
  const byId = new Map(real.map(p => [p.id, p])), byName = new Map();
  real.forEach(p => { const k = norm(p.name); if (k && !byName.has(k)) byName.set(k, p); });
  const virt = new Map(), stayP = new Map(), staysBy = new Map();
  for (const st of (D().stays || [])){
    if (st.status === "cancelled" || !validDate(st.start)) continue;
    let p = (st.personId && byId.get(st.personId)) || byName.get(norm(st.name));
    if (!p){
      const k = norm(st.name); if (!k) continue;
      p = virt.get(k);
      if (!p){ p = { id: "v:" + k, name: String(st.name).trim(), status: "confirmed", virtual: true }; virt.set(k, p); }
    }
    stayP.set(st.id, p);
    if (!staysBy.has(p.id)) staysBy.set(p.id, []);
    staysBy.get(p.id).push(st);
  }
  virt.forEach(p => { p.type = guessType(staysBy.get(p.id) || []); });
  PXC = { list: [...real, ...virt.values()], byId, byName, virt, stayP, staysOf: p => (staysBy.get(p.id) || []).slice().sort(byStart) };
  return PXC;
}
const personOfStay = st => st ? PX().stayP.get(st.id) || null : null;
const personName = st => { const p = personOfStay(st); return p ? p.name : (st && st.name) || ""; };
const findPerson = name => { const x = PX(), k = norm(name); return k ? (x.byName.get(k) || x.virt.get(k) || null) : null; };
function personById(id){
  if (!id) return null;
  const x = PX();
  if (x.byId.has(id)) return x.byId.get(id);
  if (String(id).startsWith("v:")){ const k = id.slice(2); return x.byName.get(k) || x.virt.get(k) || null; }
  return null;
}
const typeOf = p => !p ? "guest" : p.type === "threemonth" ? "longterm" : TYPE_KEYS.has(p.type) ? p.type : "guest";

function renderSummary(){
  const sps = realSpaces(); let people = 0, free = 0, notReady = 0, clash = 0;

    people += loadOn(sp.id, TODAY);

async function finishReorder(){
  const changes = [];

  for (const c of changes){ if (!(await save("spaces", c))) break; }
  renderAll(); toast(changes.length ? "Order saved" : "No changes");
}
let roDrag = null;
document.addEventListener("dragstart", e => {
  const r = e.target.closest && e.target.closest(".ro-row"); if (!r) return;
  roDrag = { id: r.dataset.id, g: Number(r.dataset.g) };
  e.dataTransfer.effectAllowed = "move"; try { e.dataTransfer.setData("text/plain", roDrag.id); } catch {}
  r.classList.add("dragging");
});
document.addEventListener("dragover", e => {
  if (!roDrag) return;
  const r = e.target.closest(".ro-row"); if (!r || Number(r.dataset.g) !== roDrag.g) return;
  e.preventDefault();
  const rect = r.getBoundingClientRect(), after = e.clientY > rect.top + rect.height / 2;
  document.querySelectorAll(".ro-row.drop-before,.ro-row.drop-after").forEach(x => x.classList.remove("drop-before", "drop-after"));
  if (r.dataset.id !== roDrag.id) r.classList.add(after ? "drop-after" : "drop-before");
});
document.addEventListener("drop", e => {
  if (!roDrag) return;
  const r = e.target.closest(".ro-row"); e.preventDefault();
  if (r && Number(r.dataset.g) === roDrag.g && r.dataset.id !== roDrag.id){
    const after = r.classList.contains("drop-after"), list = S.ro[roDrag.g];
    list.splice(list.indexOf(roDrag.id), 1);
    let to = list.indexOf(r.dataset.id); if (after) to++;
    list.splice(to, 0, roDrag.id);
  }
  roDrag = null; renderReorder();
});
document.addEventListener("dragend", () => { roDrag = null; document.querySelectorAll(".ro-row").forEach(x => x.classList.remove("dragging", "drop-before", "drop-after")); });

/* ---------- visitor view ---------- */
function visitorSpaces(from, to){
  const nights = diff(from, to);
  return sortedSpaces().map(sp => {
    if (sp.private || isRes(sp) || isHold(sp) || isLast(sp) || !maxOf(sp)) return null;
    const sts = staysFor(sp.id);
    if (sts.some(x => !x.end && x.start <= from)) return null; // someone's long-term home
    let free = 0;
    for (let i = 0; i < nights; i++){ const d = addDays(from, i); if (!notReadyOn(sp, d) && !blockedOn(sp, d) && partyCount(sts.filter(x => covers(x, d))) < (isShared(sp) ? Math.max(1, maxOf(sp)) : 1)) free++; }
    return free ? { sp, free, nights } : null;
  }).filter(Boolean).sort((a, b) => b.free - a.free);
}

/* ---------- events ----------

const ROLES = [["instructor","Leading"],["participant","Participating"],["support","Supporting"]];
const evEnd = ev => addDays(ev.last, 1);
const evDays = ev => diff(ev.start, ev.last) + 1;
const attendReady = () => S.demo || !S.hosted || S.attendOk;
function rosterOf(ev){
  if (attendReady()) return (D().attend || []).filter(r => r.eventId === ev.id && r.name && ROLES.some(x => x[0] === r.role));
  const to = evEnd(ev), seen = new Set();
  return activeStays().filter(x => x.start < to && (!x.end || x.end > ev.start)).map(x => personOfStay(x)).filter(p => p && typeOf(p) === "workshop" && !seen.has(p.id) && seen.add(p.id))
    .map(p => ({ id: "auto:" + p.id, eventId: ev.id, personId: p.id, name: p.name, role: "participant" }));
}
// "Leah" finds the "Mickey & Leah" household when nobody else has that name
function findPersonLoose(name){
  const exact = findPerson(name); if (exact) return exact;
  const words = norm(name).split(" ").filter(Boolean); if (!words.length) return null;
  const hits = PX().list.filter(p => { const toks = norm(p.name).split(/[\s,&+]+/).filter(Boolean); return words.every(w => toks.includes(w)); });
  return hits.length === 1 ? hits[0] : null;
}
function eventInfo(ev){
  const from = ev.start, to = evEnd(ev), n = diff(from, to);
  const over = x => x.start < to && (!x.end || x.end > from);
  const sts = activeStays().filter(over);
  const byP = new Map();
  sts.forEach(x => {
    const p = personOfStay(x), k = p ? p.id : "s:" + x.id;
    if (!byP.has(k)) byP.set(k, { p, sts: [] });
    byP.get(k).sts.push(x);
  });
  byP.forEach(e => { e.sts.sort(byStart); e.heads = Math.max(...e.sts.map(heads)); e.ty = typeOf(e.p); });
  const people = [...byP.values()].reduce((a, e) => a + e.heads, 0);
  const roster = rosterOf(ev).map(r => {
    const p = (r.personId && personById(r.personId)) || findPersonLoose(r.name);
    const mine = p ? (byP.get(p.id) || { sts: [] }).sts : [];
    const home = p && typeOf(p) === "resident";
    const placed = mine.filter(x => !isHold(space(x.spaceId)));
    let where = placed.length ? [...new Set(placed.map(spName))].join(" → ") : mine.length ? "Needs a space" : home ? "Lives here" : "";
    const first = mine[0], last = mine[mine.length - 1];
    if (mine.length && !home && (first.start > from || (last.end && last.end < to))) where += ` · ${fmt(first.start)} – ${last.end ? fmt(last.end) : "on"}`;
    const solo = p && norm(p.name) === norm(r.name);
    return { r, p, where, missing: !mine.length && !home, hold: mine.some(x => x.status === "hold"), heads: solo && mine.length ? Math.max(...mine.map(heads)) : 1 };
  });
  const inRoster = new Set(roster.filter(x => x.p).map(x => x.p.id));
  const rest = [...byP.values()].filter(e => !(e.p && inRoster.has(e.p.id)));
  const g = {
    needs: rest.filter(e => e.sts.every(x => isHold(space(x.spaceId)))),
    res: rest.filter(e => e.ty === "resident"),
  };
  g.other = rest.filter(e => !g.needs.includes(e) && !g.res.includes(e));
  const name = e => (e.p ? e.p.name : personName(e.sts[0])) || "";
  Object.values(g).forEach(list => list.sort((a, b) => name(a).localeCompare(name(b))));
  const sps = sortedSpaces(realSpaces());
  const free = sps.filter(s => !isRes(s) && !isLast(s) && fitFor(s, from, to, 1).ok === n);
  const part = sps.filter(s => !isRes(s) && !isLast(s)).map(s => ({ s, ok: fitFor(s, from, to, 1).ok })).filter(r => r.ok > 0 && r.ok < n);

}

// A workshop booking that overlaps an event puts the person on its list as participating
async function autoRoster(person, name, start, end){
  if (!peopleWritable() || !attendReady()) return;
  const to = end || addDays(start, 1);

async function addFormPhotos(files){
  if (!S.fp) return;
  const fp = S.fp; let failed = 0;
  fp.uploading += files.length; renderFormPhotos();
  for (const f of files){
    try {
      const blob = await shrink(f);
      if (!blob) throw 0;
      let pid;
      if (S.demo) pid = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(blob); });
      else pid = (await S.assets.upload(blob, { type: blob.type || "image/jpeg" })).id;
      fp.list.push(pid); fp.added.push(pid);
    } catch { failed++; }
    fp.uploading--; if (S.fp === fp) renderFormPhotos();
  }

    const n = diff(from, to), fitsAll = s => fitFor(s, from, to, hc, id).ok === n;

      if (isShared(sp) ? partyCount(others) >= Math.max(1, maxOf(sp)) : isLast(sp) ? peopleIn(others) + hc > Math.max(1, maxOf(sp)) : others.length){ clash++; if (!firstClash) firstClash = d; others.forEach(x => who.add(personName(x))); }
    }

    if (nr) msgs.push(`${esc(sp.name)} isn't ready for ${nr} of these nights${validDate(sp.readyBy) ? ` (expected ${fmt(sp.readyBy)})` : ""}.`);

  });

// A resident travelling: their stay ends the day they leave and picks up again when they're back, so the home shows free in between
function awayForm(pid){
  const p = personById(pid); if (!p) return;
  const home = PX().staysOf(p).filter(x => !x.end || x.end > TODAY).map(x => space(x.spaceId)).find(isRes);
  // others living in the same home can go away on the same dates with one tick
  const housemates = home ? PX().list.filter(o => o !== p && PX().staysOf(o).some(x => x.spaceId === home.id && (!x.end || x.end > TODAY))) : [];
  const stayAt = (person, d) => { const sts = PX().staysOf(person); return sts.find(x => covers(x, d)) || sts.filter(x => x.start < d && x.end === "").pop(); };
  openModal(`${p.name} away`, `
    <div class="f2">
      <label class="f"><span>Leaving</span><input id="aw-from" type="date" value="${addDays(TODAY, 1)}"></label>
      <label class="f"><span>Back <small>(blank if unknown)</small></span><input id="aw-back" type="date"></label>
    </div>
    ${housemates.length ? `<div class="f"><span>Also away</span><div class="checks">${housemates.map((o, k) => `<label><input type="checkbox" id="aw-m${k}">${esc(o.name)}</label>`).join("")}</div></div>` : ""}
    <small class="hint" id="aw-hint"></small>
  `, footer("Save"), async () => {
    const from = fv("aw-from"), back = fv("aw-back");
    if (!validDate(from)){ toast("Pick the day they leave."); return false; }
    if (back && (!validDate(back) || back <= from)){ toast("Back has to be after leaving."); return false; }
    const who = [p, ...housemates.filter((o, k) => $("#aw-m" + k).checked)];
    for (const person of who){
      const s = stayAt(person, from);
      if (!s){ toast(`${person.name} doesn't have a stay on that date.`); return false; }
      const tail = !s.end || (back && back < s.end);
      if (!(await save("stays", { ...s, end: from }))) return false;
      if (back && tail && s.start < back) await save("stays", { ...s, id: newId("stays"), start: back, end: s.end || "" });
    }
    const names = joinNames(who.map(o => o.name));
    toast(back ? `${names} away ${fmt(from)} – ${fmt(back)}` : `${names} away from ${fmt(from)}`);
  }, () => {
    const all = housemates.every((o, k) => $("#aw-m" + k).checked);
    $("#aw-hint").textContent = home ? (all ? `${home.name} shows as free while everyone is away, and Find room offers it.` : `${home.name} stays occupied by ${joinNames(housemates.filter((o, k) => !$("#aw-m" + k).checked).map(o => o.name))}.`) : "";
  });
  S.modalCtx = { id: pid };
}

const PGROUPS = [["here","Here now"],["res","Residents"],["arriving","Arriving"],["unknown","Coming, dates unknown"],["deciding","Being decided"],["past","Past"]];
function personInfo(p){
  const sts = PX().staysOf(p), cur = sts.find(x => covers(x, TODAY)), next = sts.find(x => x.start > TODAY);
  const past = sts.filter(x => x.end && x.end <= TODAY), last = past[past.length - 1], ty = typeOf(p), curSp = cur && space(cur.spaceId);
  let g;
  if (ty === "resident" || (curSp && isRes(curSp))) g = "res";
  else if (cur) g = "here";
  else if (next) g = "arriving";
  else if (p.status === "deciding") g = "deciding";
  else if (!sts.length || p.status === "coming") g = "unknown";
  else g = "past";
  return { p, sts, cur, next, last, ty, g };
}
function personRow(i){
  const { p, cur, next, last, ty, g } = i, range = x => `${fmt(x.start)}${x.end ? " – " + fmt(x.end) : " on"}`;
  let line = "", when = "", soon = false;
  if (g === "here"){
    line = `${spName(cur)}${cur.end ? ` until ${fmt(cur.end)}` : ""}`;
    const then = i.sts.find(x => x !== cur && cur.end && x.start === cur.end && x.spaceId !== cur.spaceId);
    if (then) line += `, then ${spName(then)}`;
  } else if (g === "arriving"){
    line = `${spName(next)} · ${range(next)}`;
    const d = diff(TODAY, next.start); when = d === 1 ? "Tomorrow" : d < 14 ? `in ${d} days` : fmt(next.start); soon = d <= 7;
  } else if (g === "unknown") line = p.when ? `Expected ${p.when}` : "No dates yet";
  else if (g === "deciding") line = p.when ? `Maybe ${p.when}` : next ? `${spName(next)} · ${range(next)}` : cur ? spName(cur) : "No dates yet";
  else if (g === "res"){
    const back = i.sts.find(x => x.start > (cur && cur.end ? cur.end : TODAY));
    if (cur) line = spName(cur) + (cur.end ? ` · away ${fmt(cur.end)}${back ? ` – ${fmt(back.start)}` : ""}` : "");
    else { line = back ? `Away, back ${fmt(back.start)}` : last ? `Away since ${fmt(last.end)}` : "Away"; when = "Away"; }
  }
  else line = last ? `Left ${fmt(last.end)}` : "";
  const sub = [g === "res" ? "" : label(TYPES, ty), line].filter(Boolean).join(" · ");
  return `<button class="li prow" data-act="open-person" data-id="${esc(p.id)}"><span class="swatch ty-${ty}"></span>
    <span class="grow"><span class="t">${esc(p.name)}</span><br><span class="s">${esc(sub)}</span>${p.description ? `<br><span class="s faint">${esc(trunc(p.description, 90))}</span>` : ""}</span>
    ${p.status === "deciding" && (g === "here" || g === "arriving") ? `<span class="tag-dec">Being decided</span>` : ""}${when ? `<span class="when${soon ? " soon" : ""}">${esc(when)}</span>` : ""}</button>`;
}
function renderPeople(){
  const all = PX().list.map(personInfo), listEl = $("#peopleList");
  const counts = {}; all.forEach(i => { counts[i.ty] = (counts[i.ty] || 0) + 1; });
  if (S.ptype !== "all" && !counts[S.ptype]) S.ptype = "all";
  $("#peopleTypes").innerHTML = all.length ? `<button data-ptype="all" aria-pressed="${S.ptype === "all"}">All</button>` + TYPES.filter(([k]) => counts[k]).map(([k]) => `<button data-ptype="${k}" aria-pressed="${S.ptype === k}">${esc(TYPE_SHORT[k])}</button>`).join("") : "";
  const n = g => all.filter(i => i.g === g).length;
  const soon = all.filter(i => i.g === "arriving" && diff(TODAY, i.next.start) <= 30).length;
  const onLand = activeStays().filter(x => covers(x, TODAY)).reduce((a, x) => a + heads(x), 0);
  $("#peopleSummary").innerHTML = all.length ? `<span><b>${onLand}</b>on the land</span><span><b>${soon}</b>arriving in 30 days</span>${n("unknown") ? `<span><b>${n("unknown")}</b>dates unknown</span>` : ""}${all.some(i => i.p.status === "deciding") ? `<span><b>${all.filter(i => i.p.status === "deciding").length}</b>being decided</span>` : ""}` : "";
  const note = $("#peopleNote");
  note.innerHTML = S.hosted && !S.visit && S.loaded.size && !S.peopleOk && !S.stale ? `<div class="banner"><span class="grow"><b>One more step.</b> Everyone on the calendar is listed here already. To save details like contact and arrival, update the script in your Google Sheet.</span></div>` : "";
  note.hidden = !note.innerHTML;
  if (!all.length){
    listEl.innerHTML = !S.connected || (S.db && !S.loaded.has("stays")) ? `<p class="faint">Loading…</p>` : `<div class="empty-state"><span class="label">No one yet</span><h2>Residents, helpers, workshop people and guests</h2><p>Add people as soon as you hear they might come, even without dates. Book their stay once the dates firm up.</p>${writable() ? `<div class="row"><button class="btn primary plus" data-act="new-person">Add a person</button></div>` : ""}</div>`;
    return;
  }
  const q = norm(S.pq);
  const shown = all.filter(i => (S.ptype === "all" || i.ty === S.ptype) && (!q || norm(i.p.name).includes(q) || norm(i.p.description).includes(q)));
  const byName = (a, b) => String(a.p.name).localeCompare(String(b.p.name));
  // residents follow the order of their homes (same as the calendar), then the order they were entered
  const homeOrder = new Map(sortedSpaces().map((s, k) => [s.id, k])), stayOrder = new Map(D().stays.map((x, k) => [x.id, k]));
  const homeStay = i => i.cur || i.next || i.last || i.sts[0];
  const byHome = (a, b) => { const x = homeStay(a), y = homeStay(b); return ((x ? homeOrder.get(x.spaceId) : 999) ?? 999) - ((y ? homeOrder.get(y.spaceId) : 999) ?? 999) || ((x ? stayOrder.get(x.id) : 0) ?? 0) - ((y ? stayOrder.get(y.id) : 0) ?? 0); };
  const sorts = { res: byHome, arriving: (a, b) => byStart(a.next, b.next) || byName(a, b), past: (a, b) => (a.last && b.last && a.last.end < b.last.end ? 1 : -1) };
  const html = PGROUPS.map(([g, title]) => {
    const items = shown.filter(i => i.g === g).sort(sorts[g] || byName);
    if (!items.length) return "";
    if (g === "past") return `<details class="past"><summary>Past <span class="faint" style="font-size:15px">${items.length}</span></summary><div class="list">${items.map(personRow).join("")}</div></details>`;
    const away = g === "res" ? items.filter(i => !i.cur).length : 0;
    const count = g === "here" ? `${items.reduce((a, i) => a + heads(i.cur), 0)} ${items.reduce((a, i) => a + heads(i.cur), 0) === 1 ? "person" : "people"}, plus residents below` : g === "res" ? `${items.filter(i => i.cur).reduce((a, i) => a + heads(i.cur), 0)} here${away ? ` · ${away} away` : ""}` : items.length;
    return `<div class="pgroup${g === "res" ? " res" : ""}"><div class="pgroup-h"><h3>${title}</h3><span class="n">${count}</span></div><div class="list">${items.map(personRow).join("")}</div></div>`;
  }).join("");
  const keepOpen = listEl.querySelector("details.past[open]");
  listEl.innerHTML = html || `<p class="faint">No one matches.</p>`;
  if (keepOpen){ const d = listEl.querySelector("details.past"); if (d) d.open = true; }
}

  if (!wi) return;
  const sps = sortedSpaces(realSpaces());
  if (!wi.spaceId) wi.spaceId = sps[0] && sps[0].id;
  const hasBlock = validDate(wi.blockStart);
  openModal(id ? "Edit task" : "New task", `
    <label class="f"><span>Task</span><input id="w-task" value="${esc(wi.task)}" placeholder="e.g. Install window screens" maxlength="140"></label>
    <div class="f2">
      <label class="f"><span>Space</span><select id="w-space">${sps.map(sp => `<option value="${esc(sp.id)}"${sp.id === wi.spaceId ? " selected" : ""}>${esc(sp.name)}</option>`).join("")}</select></label>
      <label class="f"><span>Estimated hours</span><input id="w-hours" type="number" min="0" step="0.5" inputmode="decimal" value="${wi.hours ?? ""}"></label>
    </div>
    <div class="f3">
      <label class="f"><span>Priority</span><select id="w-prio">${opt(PRIOS, wi.priority)}</select></label>
      <label class="f"><span>Status</span><select id="w-status">${opt(WSTAT, wi.status)}</select></label>
      <label class="f"><span>Who</span><input id="w-who" value="${esc(wi.who)}" maxlength="60"></label>
    </div>
    <div class="checks"><label><input type="checkbox" id="w-block" ${hasBlock ? "checked" : ""}>Nobody can stay there during this work</label></div>
    <div class="f2" id="w-blockwrap">
      <label class="f"><span>Closed from</span><input id="w-bstart" type="date" value="${esc(wi.blockStart || "")}"></label>
      <label class="f"><span>Open again</span><input id="w-bend" type="date" value="${esc(wi.blockEnd || "")}"></label>
    </div>
    <div id="w-warn"></div>
    <label class="f"><span>Notes</span><textarea id="w-notes" maxlength="1000" placeholder="Materials, measurements, what's holding it up">${esc(wi.notes)}</textarea></label>
  `, footer(id ? "Save" : "Add task", id ? "delete-work" : ""), async () => {
    const task = fv("w-task");
    if (!task){ toast("Describe the task."); $("#w-task").focus(); return false; }
    const blk = document.getElementById("w-block").checked, bs = fv("w-bstart"), be = fv("w-bend");
    if (blk && !validDate(bs)){ toast("Pick when the space closes for this work."); return false; }
    if (blk && validDate(be) && be <= bs){ toast("It has to open again after it closes."); return false; }
    const body = { ...(id ? wi : {}), id: id || newId("work"), task, spaceId: fv("w-space"), hours: Math.max(0, num(fv("w-hours"))),
      priority: fv("w-prio"), status: fv("w-status"), who: fv("w-who"), notes: fv("w-notes"),
      blockStart: blk ? bs : "", blockEnd: blk ? (validDate(be) ? be : addDays(bs, Math.max(1, Math.ceil(num(fv("w-hours")) / 8)))) : "" };
    if (!(await save("work", body))) return false;
    toast(id ? "Saved" : "Task added");
  }, () => {
    const blk = document.getElementById("w-block").checked;
    $("#w-blockwrap").hidden = !blk;
    const box = $("#w-warn"), bs = fv("w-bstart"), be = fv("w-bend") || (validDate(bs) ? addDays(bs, 1) : "");
    if (!blk || !validDate(bs) || be <= bs){ box.innerHTML = blk ? `<small class="hint">The calendar shows the space closed for these dates. Without an end date it uses the hour estimate at 8 hours a day.</small>` : ""; return; }

  });
  S.modalCtx = { id };

/* ---------- data layer (swap this block to move hosts) ---------- */
function newId(coll){ return (S.demo || !S.db) ? "x" + Math.random().toString(36).slice(2, 12) : S.db.collection(coll).doc().id; }
async function save(coll, obj){
  const { id, ...body } = obj; body.updatedAt = new Date().toISOString();
  pxReset();
  if (S.demo){
    if (coll === "settings") S.demoData.settings = body;
    else { const arr = S.demoData[coll], i = arr.findIndex(x => x.id === id), rec = { id, ...body }; if (i >= 0) arr[i] = rec; else arr.push(rec); }
    renderAll(); return true;
  }
  if (!S.db){ toast("The shared list isn't reachable right now."); return false; }
  try { await S.db.collection(coll).doc(id).set(body); return true; } catch (e){ return writeError(e); }
}
async function remove(coll, id){
  pxReset();
  if (S.demo){ S.demoData[coll] = S.demoData[coll].filter(x => x.id !== id); renderAll(); return true; }
  try { await S.db.collection(coll).doc(id).delete(); return true; } catch (e){ return writeError(e); }
}
function writeError(e){
  const c = e && e.code;
  if (c === "invalid_argument" && S.canWriteUnknown){ S.canWrite = false; renderAll(); toast("You can view this list but not change it."); }
  else if (c === "quota_exceeded") toast("Storage is full. Delete old stays or tasks to make room.");
  else if (c === "resource_exhausted") toast("Too many changes at once. Try again in a moment.");
  else if (c === "revoked") toast("Your access changed. Reload to continue.");
  else toast("That didn't save. Check your connection and try again.");
  return false;
}

/* ---------- photos ---------- */
async function shrink(file){
  try {
    const bmp = await createImageBitmap(file), scale = Math.min(1, 1800 / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    return (await new Promise(r => c.toBlob(r, "image/jpeg", 0.84))) || file;
  } catch { return ["image/jpeg","image/png","image/webp","image/gif"].includes(file.type) ? file : null; }
}
async function addPhotos(files){
  const sp = space(S.photoTarget); if (!sp || !files.length) return;
  toast(`Uploading ${files.length} ${files.length === 1 ? "photo" : "photos"}…`, 60000);
  const ids = []; let failed = 0;
  for (const f of files){
    const blob = await shrink(f); if (!blob){ failed++; continue; }
    if (S.demo){ ids.push(await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(blob); })); continue; }
    try { ids.push((await S.assets.upload(blob, { type: blob.type || "image/jpeg" })).id); }
    catch (e){ failed++; if (e && e.code === "quota_or_state"){ toast("Photo storage is full. Remove some photos first."); break; } }
  }
  if (ids.length){
    const cur = space(sp.id) || sp;
    if (await save("spaces", { ...cur, photos: [...(cur.photos || []), ...ids] })){ S.gIdx = (cur.photos || []).length; renderDrawer(); }
  }
  toast(failed ? `${ids.length} added, ${failed} couldn't be read. Try JPEG or PNG.` : `${ids.length} ${ids.length === 1 ? "photo" : "photos"} added`);
}
async function removePhoto(sp){
  const ph = [...(sp.photos || [])], gone = ph.splice(S.gIdx, 1)[0];
  if (!(await save("spaces", { ...sp, photos: ph }))) return;
  if (!S.demo && S.assets && gone){ try { await S.assets.delete(gone); } catch {} }
  S.gIdx = Math.max(0, S.gIdx - 1); renderDrawer(); toast("Photo removed");
}

/* ---------- toast & confirm ---------- */
let toastT, toastAction = null;
function toast(msg, ms = 2600, action){
  toastAction = action || null;
  const r = $("#toastRoot"); r.innerHTML = `<div class="toast" role="status"><span>${esc(msg)}</span>${action ? `<button data-act="toast-action">${esc(action.label)}</button>` : ""}</div>`;
  clearTimeout(toastT); toastT = setTimeout(() => { r.innerHTML = ""; }, ms);
}
function armed(btn, msg){
  if (btn.classList.contains("armed")) return true;
  btn.classList.add("armed"); const t = btn.textContent; btn.textContent = msg || "Tap again to confirm";
  setTimeout(() => { btn.classList.remove("armed"); btn.textContent = t; }, 4000);
  return false;
}

/* ---------- events ---------- */
document.addEventListener("click", async e => {
  if (suppressClick){ e.preventDefault(); e.stopPropagation(); return; }
  const tab = e.target.closest(".tab"); if (tab){ setView(tab.dataset.view); return; }
  const sub = e.target.closest("[data-sub]"); if (sub){ setView(sub.dataset.sub); return; }
  const pt = e.target.closest("[data-ptype]"); if (pt){ S.ptype = pt.dataset.ptype; renderPeople(); return; }
  const fb = e.target.closest("[data-filter]"); if (fb){ S.filter = fb.dataset.filter; renderSpaces(); return; }
  const zb = e.target.closest("[data-zoom]"); if (zb){
    const fr = $("#calFrame"), mid = S.cw ? addDays(S.cal.start, Math.floor((fr.scrollLeft + 1) / S.cw)) : TODAY;
    const right = S.cw ? addDays(S.cal.start, Math.floor((fr.scrollLeft + fr.clientWidth - NAME_W()) / S.cw)) : TODAY;
    S.cal.zoom = zb.dataset.zoom; lsSet("rb-acc-zoom", S.cal.zoom);
    S.scrollToDate = (TODAY >= mid && TODAY <= right) ? addDays(TODAY, S.cal.zoom === "week" ? -1 : -2) : (mid < S.cal.start ? S.cal.start : addDays(mid, 3));
    renderCalendar(); return; }
  const wf = e.target.closest("[data-wfilter]"); if (wf){ S.wfilter = wf.dataset.wfilter; renderWork(); return; }
  const a = e.target.closest("[data-act]");
  if (!a){
    const tr = e.target.closest("[data-track]");
    if (tr && writable()){
      const r = tr.getBoundingClientRect(), d = addDays(S.cal.start, Math.max(0, Math.floor((e.clientX - r.left) / (S.cw || cellW()))));
      stayForm(null, { spaceId: tr.dataset.track, start: d, end: addDays(d, 7) });
    }
    return;
  }
  const act = a.dataset.act, id = a.dataset.id;
  switch (act){
    case "open-space": openSpace(id); break;
    case "close-drawer": closeDrawer(); break;
    case "g-prev": case "g-next": { const n = (space(S.openSpace).photos || []).length; S.gIdx = (S.gIdx + (act === "g-next" ? 1 : -1) + n) % n; renderDrawer(); break; }
    case "g-go": S.gIdx = Number(a.dataset.i); renderDrawer(); break;
    case "new-space": spaceForm(null); break;
    case "edit-space": spaceForm(id); break;
    case "new-stay": stayForm(null, { spaceId: a.dataset.space || S.openSpace || undefined }); break;
    case "edit-stay": {
      if (!writable()) break;
      let sid = id; const ids = (a.dataset.ids || "").split(",").filter(Boolean);
      if (ids.length > 1){
        const tr = a.closest("[data-track]"), r = tr.getBoundingClientRect(), d = addDays(S.cal.start, Math.floor((e.clientX - r.left) / S.cw));
        const hit = D().stays.find(x => ids.includes(x.id) && covers(x, d)); if (hit) sid = hit.id;
      }
      stayForm(sid); break; }
    case "bar": {
      let sid = id; const ids = (a.dataset.ids || "").split(",").filter(Boolean);
      if (ids.length > 1){
        const tr = a.closest("[data-track]"), r = tr.getBoundingClientRect(), d = addDays(S.cal.start, Math.floor((e.clientX - r.left) / S.cw));
        const hit = D().stays.find(x => ids.includes(x.id) && covers(x, d)); if (hit) sid = hit.id;
      }

const CACHE_TEAM = "rb-cache-team-v1", CACHE_PUB = "rb-cache-pub-v1";
function readCache(k){ try { const c = JSON.parse(localStorage.getItem(k) || "null"); return c && c.data ? c : null; } catch { return null; } }
function writeCache(k, data){ try { localStorage.setItem(k, JSON.stringify({ at: Date.now(), data })); } catch {} }

const clock = t => new Date(t).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
const ago = t => { const m = Math.round((Date.now() - t) / 60000); return m < 1 ? "a moment ago" : m < 60 ? `${m} min ago` : m < 1440 ? `at ${clock(t)}` : new Date(t).toLocaleDateString([], { month: "short", day: "numeric" }) + " " + clock(t); };
async function gasCall(body){
  const r = await fetch(S.api, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body) });
  if (!r.ok) throw { code: "unavailable", message: "HTTP " + r.status };
  return r.json();
}
function authLost(){
  lsSet("rb-token", ""); S.token = ""; S.canWrite = false; clearCaches();
