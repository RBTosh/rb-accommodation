function gasDb(){
  let data = { spaces: [], stays: [], work: [], events: [], people: [], attend: [], settings: [] }, ready = false, queue = Promise.resolve(), pending = 0;
  const subs = [];
  const cached = readCache(CACHE_TEAM);
  if (cached){ data = cached.data; S.peopleOk = Array.isArray(data.people); S.attendOk = Array.isArray(data.attend); data.people = data.people || []; ready = true; S.stale = cached.at; }
  const snapOf = l => {
    const list = data[l.coll] || [];
    if (l.id){ const r = list.find(x => x.id === l.id); return { id: l.id, exists: !!r, data: () => r ? { ...r } : undefined, metadata: { fromCache: false, hasPendingWrites: false } }; }
    const docs = list.map(r => ({ id: r.id, exists: true, data: () => { const { id, ...rest } = r; return rest; } }));
    return { docs, size: docs.length, empty: !docs.length, metadata: { fromCache: false, hasPendingWrites: false } };
  };
  const fireAll = () => subs.forEach(l => l.cb(snapOf(l)));
  async function load(){
    const r = await gasCall({ action: "all", token: S.token });
    if (r.error === "auth") return authLost();
    if (r.error) throw r;
    if (pending) return; // a save is on its way; the next load will catch up
    S.peopleOk = Array.isArray(r.people);
    data = { spaces: r.spaces || [], stays: r.stays || [], work: r.work || [], events: r.events || [], settings: r.settings || [] };
    if (S.peopleOk) data.people = r.people;
    S.attendOk = Array.isArray(r.attend);
    data.attend = r.attend || [];
    ready = true; S.stale = 0; S.offline = false; writeCache(CACHE_TEAM, data); fireAll();
  }
  const send = body => {
    pending++;
    queue = queue.then(() => gasCall({ ...body, token: S.token }))
      .then(r => { if (r && r.error === "auth") authLost(); else if (r && r.error) throw r; })
      .catch(() => { toast("A change didn't save. Reloading the list.", 5000); pending = 0; load().catch(() => {}); })
      .finally(() => { pending = Math.max(0, pending - 1); });
    return queue;
  };
  const clean = body => { const o = {}; Object.keys(body).forEach(k => { if (k[0] !== "_") o[k] = body[k]; }); return o; };
  const ref = (coll, id) => ({ id,
    async set(body){
      const doc = { id, ...clean(body) }, list = data[coll] || (data[coll] = []);
      const i = list.findIndex(x => x.id === id); if (i >= 0) list[i] = doc; else list.push(doc);
      writeCache(CACHE_TEAM, data); fireAll(); send({ action: "save", coll, doc });
    },
    async delete(){ data[coll] = (data[coll] || []).filter(x => x.id !== id); writeCache(CACHE_TEAM, data); fireAll(); send({ action: "delete", coll, id }); },
    onSnapshot(cb){ const l = { coll, id, cb }; subs.push(l); if (ready) cb(snapOf(l)); return () => {}; },
  });
  const genId = () => (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2) + Date.now().toString(36)).replace(/-/g, "").slice(0, 20);
  const poll = () => { if (!document.hidden && !pending && !(drag && drag.started) && S.token) load().catch(() => {}); };
  setInterval(poll, 30000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(); });
  S.dbReload = () => load().catch(() => {});
  load().catch(() => { S.offline = true; renderNotice(); if (!ready) toast("Couldn't load the list. Check your connection and reload.", 6000); });
  return {
    collection: coll => ({ doc: id => ref(coll, id || genId()), onSnapshot(cb){ const l = { coll, cb }; subs.push(l); if (ready) cb(snapOf(l)); return () => {}; } }),
    doc: path => { const [c, i] = path.split("/"); return ref(c, i); },
  };
}
function gasAssets(){

      const r = await gasCall({ action: "upload", token: S.token, b64, mime: (opts && opts.type) || blob.type || "image/jpeg", name: `rb-${Date.now()}.jpg` });
      if (r.error === "auth"){ authLost(); throw { code: "not_granted" }; }
      if (r.error) throw { code: "upstream_error", message: r.message };
      if (r.shared === false) toast("Photo saved, but Google blocked public sharing, so visitors may not see it.", 6000);
      return { id: r.id, url: photoUrl(r.id) };
    },
    async delete(id){ await gasCall({ action: "deletePhoto", token: S.token, id }); return { deleted: true }; },
  };
}

  S.connected = true; S.hosted = true;
  if (!cfg.api || /PASTE/.test(cfg.api)){
    $("#notice").innerHTML = `<div class="banner"><span class="grow">Almost there: open <b>config.js</b> and paste the web app address from your Google Sheet's script.</span></div>`; return;
  }
  S.api = cfg.api.trim();
  S.photoBase = "https://drive.google.com/thumbnail?sz=w1600&id=";
  if (new URLSearchParams(location.search).has("visit")){
    S.visit = true; document.body.classList.add("visit-mode"); setView("visitors", false);
    const show = d => { S.real = { spaces: d.spaces || [], stays: d.stays || [], work: d.blocks || [], events: [], people: [], attend: [], settings: d.settings || {} }; ["spaces","stays","work"].forEach(k => S.loaded.add(k)); renderAll(); };
    const c = readCache(CACHE_PUB);
    if (c) show(c.data); else $("#pubBody").innerHTML = `<p class="faint">Loading…</p>`;
    let data; try { data = await gasCall({ action: "public" }); } catch {}
    if (!data || data.error){ if (!c) $("#pubBody").innerHTML = `<div class="none">This page couldn't load. Try again in a moment.</div>`; return; }
    writeCache(CACHE_PUB, data); show(data); return;
  }
  S.token = lsGet("rb-token") || "";
  if (!S.token){ renderAll(); showLogin(); return; }
  startTeam();
}

(async () => {
  if (window.RB_CONFIG){ hostedBoot(window.RB_CONFIG); return; }
  if (!window.claude || typeof window.claude.use !== "function"){ S.connected = true; renderAll(); return; }
  const [db, assets, user] = await Promise.all([window.claude.use("db"), window.claude.use("assets"), window.claude.use("user")]);
  S.connected = true; S.db = db; S.assets = assets;
  if (!db){ renderAll(); return; }
  let cw = null; try { cw = user ? await user.can("data.write") : null; } catch {}
  S.canWrite = cw !== false; S.canWriteUnknown = cw === null;
  subscribeAll(db);
})();
})();
</script>
